[workspace]
name = "maurice"
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }]

[dependencies]
python = "3.14.*"

[pypi-dependencies]
hermes-agent = { path = "engine", editable = true, extras = ["stt-whisper"] }
# faster-whisper 1.2.1 passes the legacy metadata_errors argument to av.open.
av = "<18"
google-auth-oauthlib = "==1.5.0"

[pypi-options.dependency-overrides]
cryptography = "==50.0.2"
pillow = "==13.0.0"

[tasks]
maurice = "python run-maurice.py"
